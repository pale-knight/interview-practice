<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>面谈练习</title>
<style>
:root{--bg:#f1f4f1;--surface:#fff;--ink:#18221d;--muted:#5b6a62;--line:#d6ded8;--accent:#1d7448;--accent-ink:#fff;--flag:#b4470f}
@media (prefers-color-scheme:dark){:root{--bg:#111613;--surface:#19201c;--ink:#e4ebe6;--muted:#97a69e;--line:#2a342e;--accent:#5ccf8f;--accent-ink:#0d1a12;--flag:#f59a5b;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
[hidden]{display:none!important}
#lock{min-height:100vh;display:grid;place-items:center;padding:0 16px}
#lock form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
#lock h1{margin:0;font-size:20px}#lock p{margin:0;color:var(--muted);font-size:13px}
#lock input[type=password]{font:15px monospace;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
#lock button{font:500 15px inherit;padding:10px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
#lock label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
#err{color:var(--flag);font-size:13px}
</style></head><body>
<div id="lock"><form id="f"><h1>面谈练习</h1><p>输入访问密钥打开练习。</p>
<input type="password" id="k" autocomplete="current-password" aria-label="访问密钥" placeholder="访问密钥">
<label><input type="checkbox" id="rem" checked> 在这台设备上记住</label>
<button type="submit" id="go">打开</button><span id="err" hidden></span></form></div>
<div id="app"></div>
<script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let blobP=fetch("data.json",{cache:"no-cache"}).then(r=>r.json());
async function unlock(key,remember){
  const B=await blobP; const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(key),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(B.salt),iterations:B.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(B.iv)},k,b64(B.ct));
  const D=JSON.parse(new TextDecoder().decode(pt));
  if(remember){try{localStorage.setItem("sz_key",key)}catch(e){}}
  document.getElementById("lock").remove();
  document.title="铃木研面谈练习";
  document.getElementById("app").innerHTML=D.markup;
  window.__S=D.S; window.AUD=D.AUD.map(x=>"data:audio/mpeg;base64,"+x);
  const s=document.createElement("script"); s.textContent=D.app; document.body.appendChild(s);
}
const f=document.getElementById("f"), err=document.getElementById("err");
f.addEventListener("submit",async e=>{e.preventDefault(); err.hidden=true; document.getElementById("go").textContent="打开中…";
  try{ await unlock(document.getElementById("k").value.trim(), document.getElementById("rem").checked); }
  catch(x){ err.textContent="密钥不对，请再检查一下。"; err.hidden=false; document.getElementById("go").textContent="打开"; }});
let saved=null; try{saved=localStorage.getItem("sz_key")}catch(e){}
if(saved) unlock(saved,false).catch(()=>{try{localStorage.removeItem("sz_key")}catch(e){}});
</script></body></html>
